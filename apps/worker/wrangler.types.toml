name = "texcra"
compatibility_date = "2026-10-06"
compatibility_flags = [
    "nodejs_compat",
    "enable_ctx_exports",
    "enable_request_signal",
]

# Nitro builds the Worker; Wrangler deploys the prebuilt modules.
main = "exports.cloudflare.ts"
no_bundle = true

[assets]
binding = "ASSETS"
directory = ".output/public"

[[rules]]
type = "ESModule"
globs = ["**/*.mjs", "**/*.js"]

[[containers]]
class_name = "ImageProcessorContainer"
scheduling_policy = "default"
image = "../bun-container/Dockerfile"
image_build_context = "../.."
instance_type = "standard-1"
max_instances = 5

[[durable_objects.bindings]]
name = "IMAGE_PROCESSOR"
class_name = "ImageProcessorContainer"

[exports.ImageProcessorContainer]
type = "durable-object"
storage = "sqlite"

[[r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "texcra-media"

# Cloudflare D1 Binding
[[d1_databases]]
binding = "DB"
database_name = "texcra-db"
database_id = "YOUR_D1_DATABASE_ID"
migrations_dir = "drizzle"
migrations_pattern = "drizzle/*/migration.sql"

[vars]
# Set to the bucket's public custom domain (or r2.dev origin for development).
MEDIA_PUBLIC_BASE_URL = ""

[observability]
enabled = true

[observability.traces]
enabled = true
head_sampling_rate = 0.01
